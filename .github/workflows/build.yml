name: Build installers

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-latest, artifact: windows-x64, command: dist:win}
          - {runner: ubuntu-latest, artifact: linux-x64, command: dist:linux}
          - {runner: ubuntu-24.04-arm, artifact: linux-arm64, command: dist:linux}
          - {runner: macos-latest, artifact: macos-arm64, command: dist:mac}
          - {runner: macos-15-intel, artifact: macos-x64, command: dist:mac}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - if: runner.os == 'Windows'
        run: npm run smoke:ui
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm -v 1.18.0
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"
      - run: npm run ${{ matrix.command }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deptriagem-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
